services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: importpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-importpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-importpilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - importpilot-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-importpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.2-bookworm
    container_name: importpilot-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - importpilot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.75
    container_name: importpilot-seaweedfs
    command: "server -s3"
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - importpilot-seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: importpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-importpilot_rmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-secret_rmq}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - importpilot-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - evaluation
    restart: unless-stopped

volumes:
  importpilot-postgres-data:
  importpilot-redis-data:
  importpilot-seaweedfs-data:
  importpilot-rabbitmq-data:
